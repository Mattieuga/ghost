<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Open Ghost</title>
    <style>
      :root {
        color: #f5f2eb;
        background: #10100f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100vw - 3rem));
        text-align: center;
      }

      .kicker {
        color: #f47745;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0;
        font-family: Georgia, serif;
        font-size: 2rem;
        font-weight: 500;
      }

      p {
        color: #aaa7a1;
        line-height: 1.6;
      }

      a {
        color: inherit;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      .button {
        border: 1px solid #3b3935;
        border-radius: 0.5rem;
        padding: 0.65rem 1rem;
        text-decoration: none;
      }

      .button.primary {
        border-color: #f47745;
        background: #f47745;
        color: #15120f;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">Ghost Cloud</div>
      <h1>Opening Ghost…</h1>
      <p id="status">Ghost should open automatically to finish signing you in.</p>
      <div class="actions">
        <a id="open-ghost" class="button primary" href="ghost-md://auth/callback">Open Ghost</a>
        <a class="button" href="https://github.com/Mattieuga/ghost/releases/latest">Download Ghost</a>
      </div>
    </main>
    <script src="./callback.js"></script>
  </body>
</html>
