<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost — A minimalist markdown editor for Mac</title>
  <meta name="description" content="A simple, beautiful markdown editor for Mac. Free and open source.">
  <link rel="icon" type="image/png" href="icon.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src 'self'">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #09090b;
      color: #a1a1aa;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── TRON background canvas ── */
    .tron-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* ── Deep parallax grid — larger cells, shifts on scroll ── */
    .tron-deep-grid {
      position: fixed;
      inset: -300px;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      will-change: transform;
      transform: translate(30px, 30px);
    }

    .tron-deep-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 237px,
          rgba(245, 124, 0, 0.06) 237px,
          rgba(245, 124, 0, 0.15) 239px,
          rgba(245, 124, 0, 0.06) 241px,
          transparent 243px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 237px,
          rgba(245, 124, 0, 0.06) 237px,
          rgba(245, 124, 0, 0.15) 239px,
          rgba(245, 124, 0, 0.06) 241px,
          transparent 243px
        );
    }

    /* Vignette — fades all grid layers toward edges */
    .tron-vignette {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 55% 45% at 50% 40%, transparent 0%, #09090b 100%);
    }

    /* ── Intersection node pulses ── */
    .tron-nodes {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .node {
      position: absolute;
      width: 5px;
      height: 5px;
      margin-left: -2px;
      margin-top: -2px;
      border-radius: 50%;
      background: rgba(245, 124, 0, 0.8);
      box-shadow: 0 0 8px 2px rgba(245, 124, 0, 0.4), 0 0 20px 4px rgba(245, 124, 0, 0.15);
      animation: node-pulse ease-in-out infinite;
      opacity: 0;
    }

    @keyframes node-pulse {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50%      { opacity: 1; transform: scale(1.2); }
    }

    /* Vertical grid lines — faint static structure */
    .tron-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 59px,
        rgba(245, 124, 0, 0.06) 59px,
        rgba(245, 124, 0, 0.06) 60px
      );
    }

    /* Horizontal grid lines */
    .tron-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 59px,
        rgba(113, 113, 122, 0.07) 59px,
        rgba(113, 113, 122, 0.07) 60px
      );
    }

    /* ── Streaking lines — ghosts in the machine ── */
    .tron-streaks {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Each streak is a thin line that flies across the viewport */
    .streak {
      position: absolute;
      border-radius: 2px;
    }

    /* Vertical streaks */
    .streak--v { width: 1px; animation-timing-function: linear; animation-iteration-count: infinite; }
    .streak--v.down { animation-name: streak-down; }
    .streak--v.up   { animation-name: streak-up;   }

    /* Horizontal streaks */
    .streak--h { height: 1px; animation-timing-function: linear; animation-iteration-count: infinite; }
    .streak--h.right { animation-name: streak-right; }
    .streak--h.left  { animation-name: streak-left;  }

    @keyframes streak-down {
      0%   { transform: translateY(-100%); opacity: 0; }
      5%   { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(calc(100vh + 100%)); opacity: 0; }
    }

    @keyframes streak-up {
      0%   { transform: translateY(calc(100vh + 100%)); opacity: 0; }
      5%   { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-100%); opacity: 0; }
    }

    @keyframes streak-right {
      0%   { transform: translateX(-100%); opacity: 0; }
      5%   { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(calc(100vw + 100%)); opacity: 0; }
    }

    @keyframes streak-left {
      0%   { transform: translateX(calc(100vw + 100%)); opacity: 0; }
      5%   { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(-100%); opacity: 0; }
    }

    /* Vertical streaks — snapped to grid lines at 59, 119, 179… */
    .streak--v1  { left: 59px;   height: 120px; background: linear-gradient(180deg, transparent, #52525b, transparent); animation-duration: 7s;  animation-delay: -3s;   }
    .streak--v2  { left: 239px;  height: 160px; background: linear-gradient(180deg, transparent, #3f3f46, transparent); animation-duration: 9s;  animation-delay: -7s;   }
    .streak--v3  { left: 479px;  height: 90px;  background: linear-gradient(180deg, transparent, rgba(245,124,0,0.6), transparent); animation-duration: 5s;  animation-delay: -2s;   }
    .streak--v4  { left: 719px;  height: 140px; background: linear-gradient(180deg, transparent, #52525b, transparent); animation-duration: 11s; animation-delay: -9s;   }
    .streak--v5  { left: 959px;  height: 100px; background: linear-gradient(180deg, transparent, #3f3f46, transparent); animation-duration: 8s;  animation-delay: -5s;   }
    .streak--v6  { left: 359px;  height: 70px;  background: linear-gradient(180deg, transparent, rgba(245,124,0,0.45), transparent); animation-duration: 6s;  animation-delay: -1s;   }
    .streak--v7  { left: 599px;  height: 130px; background: linear-gradient(180deg, transparent, #3f3f46, transparent); animation-duration: 10s; animation-delay: -6s;   }
    .streak--v8  { left: 179px;  height: 60px;  background: linear-gradient(180deg, transparent, rgba(245,124,0,0.35), transparent); animation-duration: 7.5s; animation-delay: -4s;   }
    .streak--v9  { left: 839px;  height: 150px; background: linear-gradient(180deg, transparent, #52525b, transparent); animation-duration: 12s; animation-delay: -10s;  }
    .streak--v10 { left: 1139px; height: 80px;  background: linear-gradient(180deg, transparent, #3f3f46, transparent); animation-duration: 6.5s; animation-delay: -3.5s; }

    /* Horizontal streaks — snapped to grid lines at 59, 119, 179… */
    .streak--h1  { top: 115px;  width: 220px; background: linear-gradient(90deg, transparent, #3f3f46, transparent); animation-duration: 8s;  animation-delay: -6s;   }
    .streak--h2  { top: 295px;  width: 280px; background: linear-gradient(90deg, transparent, rgba(245,124,0,0.5), transparent); animation-duration: 6s;  animation-delay: -2s;   }
    .streak--h3  { top: 475px;  width: 180px; background: linear-gradient(90deg, transparent, #52525b, transparent); animation-duration: 10s; animation-delay: -8s;   }
    .streak--h4  { top: 655px;  width: 240px; background: linear-gradient(90deg, transparent, #3f3f46, transparent); animation-duration: 9s;  animation-delay: -4s;   }
    .streak--h5  { top: 775px;  width: 150px; background: linear-gradient(90deg, transparent, rgba(245,124,0,0.4), transparent); animation-duration: 7s;  animation-delay: -5.5s; }
    .streak--h6  { top: 415px;  width: 200px; background: linear-gradient(90deg, transparent, #3f3f46, transparent); animation-duration: 11s; animation-delay: -1s;   }

    /* Mouse-reactive grid — brighter grid revealed by cursor */
    .tron-mouse-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 59px,
          rgba(250, 250, 250, 0.25) 59px,
          rgba(250, 250, 250, 0.25) 60px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 59px,
          rgba(250, 250, 250, 0.25) 59px,
          rgba(250, 250, 250, 0.25) 60px
        );
      -webkit-mask-image: radial-gradient(circle 300px at var(--mx, -500px) var(--my, -500px), rgba(0,0,0,0.9) 0%, transparent 100%);
      mask-image: radial-gradient(circle 300px at var(--mx, -500px) var(--my, -500px), rgba(0,0,0,0.9) 0%, transparent 100%);
    }

    /* Ambient glow behind the hero — subtle amber haze */
    .tron-glow {
      position: fixed;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(245, 124, 0, 0.04) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* All content above the background */
    .hero, .screenshot-wrapper, .footer {
      position: relative;
      z-index: 1;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 24px 48px;
      max-width: 720px;
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.5;
      color: #71717a;
      margin-bottom: 8px;
    }

    .subtitle-secondary {
      font-size: 20px;
      color: #52525b;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: #fafafa;
      color: #09090b;
      border: 1px solid #fafafa;
    }

    .btn-primary:hover {
      background: #e4e4e7;
      border-color: #e4e4e7;
    }

    .btn-secondary {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #27272a;
    }

    .btn-secondary:hover {
      border-color: #3f3f46;
      color: #e4e4e7;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .screenshot-wrapper {
      width: 100%;
      max-width: 920px;
      padding: 0 24px;
      margin: 48px 0 64px;
    }

    .screenshot {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #1c1c20;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .footer {
      padding: 32px 24px 48px;
      color: #3f3f46;
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    .footer span {
      margin: 0 8px;
    }

    /* Reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      .streak { animation: none !important; opacity: 0.3; }
    }
  </style>
</head>
<body>
  <!-- Deep parallax grid (behind everything) -->
  <div class="tron-deep-grid" id="deepGrid"></div>

  <!-- TRON grid + mouse spotlight + ambient glow -->
  <div class="tron-bg"></div>
  <div class="tron-nodes" id="tronNodes"></div>
  <div class="tron-mouse-grid" id="mouseGrid"></div>
  <div class="tron-glow"></div>

  <!-- Streaking lines — ghosts in the machine -->
  <div class="tron-streaks">
    <div class="streak streak--v down  streak--v1"></div>
    <div class="streak streak--v up    streak--v2"></div>
    <div class="streak streak--v down  streak--v3"></div>
    <div class="streak streak--v up    streak--v4"></div>
    <div class="streak streak--v down  streak--v5"></div>
    <div class="streak streak--v up    streak--v6"></div>
    <div class="streak streak--v down  streak--v7"></div>
    <div class="streak streak--v up    streak--v8"></div>
    <div class="streak streak--v down  streak--v9"></div>
    <div class="streak streak--v up    streak--v10"></div>
    <div class="streak streak--h right streak--h1"></div>
    <div class="streak streak--h left  streak--h2"></div>
    <div class="streak streak--h right streak--h3"></div>
    <div class="streak streak--h left  streak--h4"></div>
    <div class="streak streak--h right streak--h5"></div>
    <div class="streak streak--h left  streak--h6"></div>
  </div>

  <!-- Vignette overlay — darkens edges -->
  <div class="tron-vignette"></div>

  <div class="hero">
    <img src="icon.png" alt="Ghost" class="icon">
    <h1>Ghost</h1>
    <p class="subtitle">A simple, beautiful markdown editor for Mac.</p>
    <p class="subtitle-secondary">Free and open source.</p>
    <div class="buttons">
      <a href="https://github.com/Mattieuga/ghost/releases/download/v0.6.0/Ghost_0.6.0_aarch64.dmg" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download for Mac
      </a>
      <a href="https://github.com/Mattieuga/ghost" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        View on GitHub
      </a>
    </div>
  </div>

  <div class="screenshot-wrapper">
    <img src="screenshot.png" alt="Ghost editor screenshot" class="screenshot">
  </div>

  <div class="footer">
    Free forever <span>&middot;</span> macOS only <span>&middot;</span> Open source
  </div>
  <script>
    // Mouse spotlight
    const grid = document.getElementById('mouseGrid');
    document.addEventListener('mousemove', (e) => {
      grid.style.setProperty('--mx', e.clientX + 'px');
      grid.style.setProperty('--my', e.clientY + 'px');
    });

    // Parallax deep grid on scroll
    const deepGrid = document.getElementById('deepGrid');
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      deepGrid.style.transform = `translate(30px, ${30 + y * -0.5}px)`;
    }, { passive: true });

    // Generate pulsing intersection nodes
    const nodesContainer = document.getElementById('tronNodes');
    const GRID = 60;
    const cols = Math.ceil(window.innerWidth / GRID);
    const rows = Math.ceil(window.innerHeight / GRID);
    const count = 18;
    const used = new Set();
    for (let i = 0; i < count; i++) {
      let key;
      do {
        const c = Math.floor(Math.random() * (cols - 1)) + 1;
        const r = Math.floor(Math.random() * (rows - 1)) + 1;
        key = `${c},${r}`;
      } while (used.has(key));
      used.add(key);
      const [c, r] = key.split(',').map(Number);
      const dot = document.createElement('div');
      dot.className = 'node';
      dot.style.left = (c * GRID - 1) + 'px';
      dot.style.top = (r * GRID - 1) + 'px';
      dot.style.animationDuration = (3 + Math.random() * 4) + 's';
      dot.style.animationDelay = (-Math.random() * 6) + 's';
      nodesContainer.appendChild(dot);
    }
  </script>
</body>
</html>
